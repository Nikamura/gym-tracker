<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LemonGym Occupancy</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; padding: 20px; }
  h1 { margin-bottom: 8px; }
  .subtitle { color: #8b949e; margin-bottom: 20px; }
  .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  select, button { background: #161b22; color: #e6edf3; border: 1px solid #30363d; padding: 8px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button.active { background: #1f6feb; border-color: #1f6feb; }
  .chart-container { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  canvas { max-height: 500px; }
  .loading { text-align: center; padding: 40px; color: #8b949e; }
</style>
</head>
<body>

<h1>LemonGym Occupancy Tracker</h1>
<p class="subtitle">Live occupancy data collected every 15 minutes</p>

<div class="controls">
  <select id="city">
    <option value="all">All cities</option>
  </select>
  <select id="club">
    <option value="all">All clubs</option>
  </select>
  <button class="active" data-days="1">Today</button>
  <button data-days="3">3 days</button>
  <button data-days="7">7 days</button>
  <button data-days="30">30 days</button>
</div>

<div class="chart-container">
  <div class="loading" id="loading">Loading data...</div>
  <canvas id="chart" style="display:none"></canvas>
</div>

<script>
const REPO = 'Nikamura/gym-tracker';
const COLORS = [
  '#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd',
  '#8c564b','#e377c2','#7f7f7f','#bcbd22','#17becf',
  '#aec7e8','#ffbb78','#98df8a','#ff9896','#c5b0d5',
  '#c49c94','#f7b6d2','#c7c7c7','#dbdb8d','#9edae5'
];

let allData = [];
let chart = null;
let selectedDays = 1;

async function fetchFileList() {
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/data`);
  if (!res.ok) return [];
  const files = await res.json();
  return files
    .filter(f => f.name.endsWith('.csv'))
    .map(f => f.name)
    .sort();
}

function parseCsv(text) {
  const lines = text.trim().split('\n');
  return lines.slice(1).map(line => {
    const [timestamp, city, club, address, occupancy] = line.split(',');
    return { timestamp: new Date(timestamp), city, club, address, occupancy: Number(occupancy) };
  }).filter(r => !isNaN(r.occupancy));
}

async function loadData() {
  const files = await fetchFileList();
  if (!files.length) {
    document.getElementById('loading').textContent = 'No data yet. Wait for the first scheduled run.';
    return;
  }

  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 30);
  const relevantFiles = files.filter(f => f.replace('.csv', '') >= cutoff.toISOString().slice(0, 10));

  const results = await Promise.all(
    relevantFiles.map(async f => {
      const res = await fetch(`https://raw.githubusercontent.com/${REPO}/main/data/${f}`);
      return res.ok ? res.text() : '';
    })
  );

  allData = results.flatMap(parseCsv);
  populateFilters();
  renderChart();
}

function populateFilters() {
  const cities = [...new Set(allData.map(r => r.city))].sort();
  const citySelect = document.getElementById('city');
  citySelect.innerHTML = '<option value="all">All cities</option>';
  cities.forEach(c => {
    citySelect.innerHTML += `<option value="${c}">${c}</option>`;
  });
  updateClubFilter();
}

function updateClubFilter() {
  const city = document.getElementById('city').value;
  const filtered = city === 'all' ? allData : allData.filter(r => r.city === city);
  const clubs = [...new Set(filtered.map(r => r.club))].sort();
  const clubSelect = document.getElementById('club');
  clubSelect.innerHTML = '<option value="all">All clubs</option>';
  clubs.forEach(c => {
    clubSelect.innerHTML += `<option value="${c}">${c}</option>`;
  });
}

function renderChart() {
  const city = document.getElementById('city').value;
  const club = document.getElementById('club').value;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - selectedDays);

  let filtered = allData.filter(r => r.timestamp >= cutoff);
  if (city !== 'all') filtered = filtered.filter(r => r.city === city);
  if (club !== 'all') filtered = filtered.filter(r => r.club === club);

  const clubs = [...new Set(filtered.map(r => r.club))].sort();
  const datasets = clubs.map((c, i) => ({
    label: c,
    data: filtered.filter(r => r.club === c).map(r => ({ x: r.timestamp, y: r.occupancy })),
    borderColor: COLORS[i % COLORS.length],
    backgroundColor: COLORS[i % COLORS.length] + '33',
    borderWidth: 2,
    pointRadius: selectedDays <= 1 ? 3 : selectedDays <= 3 ? 2 : 0,
    tension: 0.3,
  }));

  document.getElementById('loading').style.display = 'none';
  const canvas = document.getElementById('chart');
  canvas.style.display = 'block';

  if (chart) chart.destroy();
  chart = new Chart(canvas, {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      interaction: { mode: 'nearest', intersect: false },
      scales: {
        x: {
          type: 'time',
          time: { tooltipFormat: 'MMM d, HH:mm' },
          grid: { color: '#21262d' },
          ticks: { color: '#8b949e' },
        },
        y: {
          min: 0, max: 100,
          title: { display: true, text: 'Occupancy %', color: '#8b949e' },
          grid: { color: '#21262d' },
          ticks: { color: '#8b949e' },
        }
      },
      plugins: {
        legend: { labels: { color: '#e6edf3' } },
        tooltip: {
          callbacks: {
            label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y}%`
          }
        }
      }
    }
  });
}

document.getElementById('city').addEventListener('change', () => { updateClubFilter(); renderChart(); });
document.getElementById('club').addEventListener('change', renderChart);
document.querySelectorAll('button[data-days]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('button[data-days]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedDays = Number(btn.dataset.days);
    renderChart();
  });
});

loadData();
</script>
</body>
</html>
