<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Occupancy Tracker</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="Live occupancy tracker for gyms and pools in Lithuania">
<meta property="og:title" content="Gym Occupancy Tracker">
<meta property="og:description" content="Live occupancy tracker for gyms and pools in Lithuania">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gym-tracker.cn.lt">
<meta property="og:image" content="https://gym-tracker.cn.lt/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://gym-tracker.cn.lt/og.png">
<meta name="twitter:title" content="Gym Occupancy Tracker">
<meta name="twitter:description" content="Live occupancy tracker for gyms and pools in Lithuania">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
<script>
  // Apply theme before render to prevent flash
  (function() {
    var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root { --bg: #0d1117; --bg2: #161b22; --text: #e6edf3; --text2: #8b949e; --border: #30363d; --accent: #1f6feb; --accent-hover: #58a6ff; --grid: #21262d; }
  :root[data-theme="light"] { --bg: #ffffff; --bg2: #f6f8fa; --text: #1f2328; --text2: #656d76; --border: #d1d9e0; --accent: #0969da; --accent-hover: #0550ae; --grid: #d1d9e0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 16px; max-width: 1200px; margin: 0 auto; }
  .header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  h1 { font-size: clamp(1.2rem, 4vw, 1.8rem); }
  .theme-toggle { background: var(--bg2); color: var(--text2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 18px; line-height: 1; margin-left: auto; }
  .theme-toggle:hover { border-color: var(--accent-hover); }
  .subtitle { color: var(--text2); margin-bottom: 16px; font-size: 14px; }
  .controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  select { background: var(--bg2); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; flex: 1; min-width: 0; max-width: 200px; }
  .time-buttons { display: flex; gap: 4px; }
  .time-buttons button { background: var(--bg2); color: var(--text); border: 1px solid var(--border); padding: 8px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .time-buttons button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chart-container { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; height: 60vh; min-height: 300px; position: relative; }
  .loading { text-align: center; padding: 40px; color: var(--text2); }
  .status-boxes { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .status-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; min-width: 120px; flex: 1; max-width: 200px; }
  .status-box .club-name { font-size: 12px; color: var(--text2); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status-box .club-value { font-size: 24px; font-weight: 600; }
  .status-box .club-value::after { content: '%'; font-size: 14px; font-weight: 400; color: var(--text2); margin-left: 2px; }
  .club-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .club-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 5px 12px; font-size: 12px; cursor: pointer; user-select: none; transition: opacity 0.15s; color: var(--text); }
  .club-chip:hover { border-color: var(--accent-hover); }
  .club-chip.hidden { opacity: 0.35; }
  .club-chip .chip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  @media (max-width: 480px) {
    body { padding: 12px; }
    select { max-width: none; flex: 1 1 calc(50% - 4px); }
    .time-buttons { width: 100%; }
    .time-buttons button { flex: 1; padding: 10px 4px; }
    .club-chips { gap: 4px; }
    .club-chip { padding: 4px 8px; font-size: 11px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Gym Occupancy Tracker</h1>
  <button class="theme-toggle" id="theme-toggle" title="Toggle theme">&#9790;</button>
</div>
<p class="subtitle">Live occupancy data collected periodically</p>

<div class="controls">
  <select id="city">
    <option value="all">All cities</option>
  </select>
  <div class="time-buttons">
    <button class="active" data-days="1">Today</button>
    <button data-days="3">3d</button>
    <button data-days="7">7d</button>
    <button data-days="30">30d</button>
  </div>
</div>

<div class="club-chips" id="club-chips"></div>

<div class="chart-container">
  <div class="loading" id="loading">Loading data...</div>
  <canvas id="chart" style="display:none"></canvas>
</div>

<div class="status-boxes" id="status-boxes"></div>

<script>
const REPO = 'Nikamura/gym-tracker';
const COLORS = [
  '#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd',
  '#8c564b','#e377c2','#7f7f7f','#bcbd22','#17becf',
  '#aec7e8','#ffbb78','#98df8a','#ff9896','#c5b0d5',
  '#c49c94','#f7b6d2','#c7c7c7','#dbdb8d','#9edae5'
];

let allData = [];
let chart = null;
let selectedDays = 1;
let selectedClubs = new Set(); // empty = all visible

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function applyThemeIcon() {
  const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  document.getElementById('theme-toggle').innerHTML = isDark ? '&#9790;' : '&#9728;';
}

document.getElementById('theme-toggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  applyThemeIcon();
  if (chart) renderChart();
});

applyThemeIcon();

function isClubVisible(club) {
  return selectedClubs.size === 0 || selectedClubs.has(club);
}

function readParams() {
  const p = new URLSearchParams(location.search);
  const clubsStr = p.get('clubs');
  return { city: p.get('city'), clubs: clubsStr ? clubsStr.split(',') : [], days: p.get('days') };
}

function writeParams() {
  const city = document.getElementById('city').value;
  const p = new URLSearchParams();
  if (city !== 'all') p.set('city', city);
  if (selectedClubs.size > 0) p.set('clubs', [...selectedClubs].join(','));
  if (selectedDays !== 1) p.set('days', selectedDays);
  const qs = p.toString();
  history.replaceState(null, '', qs ? '?' + qs : location.pathname);
}

async function fetchFileList() {
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/data`);
  if (!res.ok) return [];
  const files = await res.json();
  return files
    .filter(f => f.name.endsWith('.csv'))
    .map(f => f.name)
    .sort();
}

function parseCsv(text) {
  const lines = text.trim().split('\n');
  return lines.slice(1).map(line => {
    const [timestamp, city, club, address, occupancy] = line.split(',');
    let pct = Number(occupancy);
    if (pct === 100) pct = 0; // API returns 100 for closed/unavailable clubs
    return { timestamp: new Date(timestamp), city, club, address, occupancy: pct };
  }).filter(r => !isNaN(r.occupancy));
}

async function loadData() {
  const files = await fetchFileList();
  if (!files.length) {
    document.getElementById('loading').textContent = 'No data yet. Wait for the first scheduled run.';
    return;
  }

  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 30);
  const relevantFiles = files.filter(f => f.replace('.csv', '') >= cutoff.toISOString().slice(0, 10));

  const results = await Promise.all(
    relevantFiles.map(async f => {
      const res = await fetch(`https://raw.githubusercontent.com/${REPO}/main/data/${f}`);
      return res.ok ? res.text() : '';
    })
  );

  allData = results.flatMap(parseCsv);
  populateFilters();
  renderChart();
}

function populateFilters() {
  const params = readParams();
  const cities = [...new Set(allData.map(r => r.city))].sort();
  const citySelect = document.getElementById('city');
  citySelect.innerHTML = '<option value="all">All cities</option>';
  cities.forEach(c => {
    citySelect.innerHTML += `<option value="${c}">${c}</option>`;
  });
  if (params.city) citySelect.value = params.city;
  selectedClubs = new Set(params.clubs);
  if (params.days) {
    selectedDays = Number(params.days);
    document.querySelectorAll('button[data-days]').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.days) === selectedDays);
    });
  }
}

function renderClubChips(clubs) {
  const container = document.getElementById('club-chips');
  container.innerHTML = clubs.map((c, i) => {
    const color = COLORS[i % COLORS.length];
    const hiddenClass = isClubVisible(c) ? '' : ' hidden';
    return `<button class="club-chip${hiddenClass}" data-club="${c}"><span class="chip-dot" style="background:${color}"></span>${c}</button>`;
  }).join('');
  container.querySelectorAll('.club-chip').forEach(chip => {
    chip.addEventListener('click', () => toggleClubVisibility(chip.dataset.club));
  });
}

function toggleClubVisibility(clubName, allClubs) {
  if (!allClubs) {
    allClubs = [...document.querySelectorAll('.club-chip')].map(c => c.dataset.club);
  }
  const visibleCount = allClubs.filter(c => isClubVisible(c)).length;

  if (!isClubVisible(clubName)) {
    // Hidden club clicked → show it
    selectedClubs.add(clubName);
    if (selectedClubs.size >= allClubs.length) selectedClubs = new Set();
  } else if (visibleCount === 1) {
    // Last visible club clicked → show all
    selectedClubs = new Set();
  } else if (selectedClubs.size === 0) {
    // All visible, click one → solo it
    selectedClubs = new Set([clubName]);
  } else {
    // Some hidden, toggle this one off
    selectedClubs.delete(clubName);
  }
  syncVisibility();
  writeParams();
}

function syncVisibility() {
  document.querySelectorAll('.club-chip').forEach(chip => {
    chip.classList.toggle('hidden', !isClubVisible(chip.dataset.club));
  });
  if (chart) {
    chart.data.datasets.forEach((ds, i) => {
      chart.getDatasetMeta(i).hidden = !isClubVisible(ds.label);
    });
    chart.update('none');
  }
  document.querySelectorAll('.status-box').forEach(box => {
    const name = box.querySelector('.club-name').textContent;
    box.style.display = isClubVisible(name) ? '' : 'none';
  });
}

function renderChart() {
  const city = document.getElementById('city').value;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - selectedDays);

  let filtered = allData.filter(r => r.timestamp >= cutoff);
  if (city !== 'all') filtered = filtered.filter(r => r.city === city);

  const clubs = [...new Set(filtered.map(r => r.club))].sort();
  renderClubChips(clubs);

  const datasets = clubs.map((c, i) => ({
    label: c,
    data: filtered.filter(r => r.club === c).map(r => ({ x: r.timestamp, y: r.occupancy })),
    borderColor: COLORS[i % COLORS.length],
    backgroundColor: COLORS[i % COLORS.length] + '33',
    borderWidth: 2,
    pointRadius: selectedDays <= 1 ? 3 : selectedDays <= 3 ? 2 : 0,
    tension: 0.3,
    hidden: !isClubVisible(c),
  }));

  document.getElementById('loading').style.display = 'none';
  const canvas = document.getElementById('chart');
  canvas.style.display = 'block';

  const statusContainer = document.getElementById('status-boxes');
  statusContainer.innerHTML = clubs.map((c, i) => {
    const clubData = filtered.filter(r => r.club === c);
    const latest = clubData[clubData.length - 1];
    const color = COLORS[i % COLORS.length];
    const display = isClubVisible(c) ? '' : 'display:none;';
    return `<div class="status-box" style="border-color:${color}40;${display}"><div class="club-name" title="${c}">${c}</div><div class="club-value" style="color:${color}">${latest ? latest.occupancy : '–'}</div></div>`;
  }).join('');

  if (chart) chart.destroy();
  chart = new Chart(canvas, {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'nearest', intersect: false },
      scales: {
        x: {
          type: 'time',
          time: { tooltipFormat: 'MMM d, HH:mm' },
          grid: { color: cssVar('--grid') },
          ticks: { color: cssVar('--text2') },
        },
        y: {
          min: 0, max: 100,
          title: { display: true, text: 'Occupancy %', color: cssVar('--text2') },
          grid: { color: cssVar('--grid') },
          ticks: { color: cssVar('--text2') },
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y}%`
          }
        }
      }
    }
  });
}

document.getElementById('city').addEventListener('change', () => { selectedClubs = new Set(); renderChart(); writeParams(); });
document.querySelectorAll('button[data-days]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('button[data-days]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedDays = Number(btn.dataset.days);
    renderChart();
    writeParams();
  });
});

loadData();
</script>

</body>
</html>
